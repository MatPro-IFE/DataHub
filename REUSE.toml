# Licensing of every file in this repository (REUSE specification 3.3, https://reuse.software).
# Source files also carry SPDX headers; this file covers files that cannot.
version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Institutt for Energiteknikk (IFE)"
SPDX-License-Identifier = "Apache-2.0"

# Technical report, its figures and the user documentation
[[annotations]]
path = ["docs/**/*.md", "docs/technical_report/figures/**", "docs/technical_report/*.pdf"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Institutt for Energiteknikk (IFE)"
SPDX-License-Identifier = "CC-BY-4.0"

# Scripts that generate the figures stay Apache-2.0
[[annotations]]
path = ["docs/technical_report/figures/src/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Institutt for Energiteknikk (IFE)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["docs/technical_report/brand/logo/**"]
precedence = "override"
SPDX-FileCopyrightText = "Institutt for Energiteknikk (IFE)"
SPDX-License-Identifier = "LicenseRef-IFE-Trademark"

[[annotations]]
path = ["docs/technical_report/brand/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2012-2015 The Mozilla Foundation and Telefonica S.A."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["dashboard/static/vendor/bootstrap/**"]
precedence = "override"
SPDX-FileCopyrightText = "2011-2024 The Bootstrap Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["dashboard/static/vendor/bootstrap-icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2024 The Bootstrap Authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["dashboard/static/vendor/vis-network/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2017 Almende B.V. and Contributors, 2017-2019 vis.js contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

[[annotations]]
path = ["dashboard/static/vendor/swagger-ui/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2021 SmartBear Software Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["dashboard/static/vendor/fonts/*.woff2", "dashboard/static/vendor/fonts/LICENSE-*"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors; 2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"
