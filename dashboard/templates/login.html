<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — DataHub</title>
  <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
  <style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --brand:  #00e5c9;
    --accent: #818cf8;
    --bg:     #070c18;
    --surface: #0f1a2e;
    --surface-2: #142038;
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text:   #e2eaf8;
    --text-2: #8fa8c8;
    --text-3: #546e8a;
    --red:    #f87171;
    --font:   'Inter', system-ui, sans-serif;
  }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* animated background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 90% 70% at 15% 15%, rgba(129,140,248,.12) 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 85% 85%, rgba(0,229,201,.1)   0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(7,12,24,1) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
    animation: bg-shift 12s ease-in-out infinite alternate;
  }
  @keyframes bg-shift {
    0%   { opacity: 1; }
    50%  { opacity: .7; }
    100% { opacity: 1; }
  }

  /* grid overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  .login-wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    padding: 1rem;
  }

  .login-card {
    background: rgba(15,26,46,.8);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--border-2);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    box-shadow: 0 8px 48px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
  }

  /* logo mark */
  .logo-mark {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: #fff;
    letter-spacing: -.03em;
    margin: 0 auto .75rem;
    box-shadow: 0 4px 24px rgba(0,229,201,.3);
  }
  .login-title {
    font-size: 1.25rem; font-weight: 700;
    letter-spacing: -.03em; color: var(--text);
    text-align: center; margin: 0 0 .3rem;
  }
  .login-sub {
    font-size: .78rem; color: var(--text-3);
    text-align: center; margin: 0 0 1.75rem;
  }

  /* form */
  label {
    display: block;
    font-size: .78rem; font-weight: 500;
    color: var(--text-2); margin-bottom: .35rem;
  }
  .field { margin-bottom: 1.1rem; }
  .input-row {
    display: flex; align-items: stretch;
    border: 1px solid var(--border-2);
    border-radius: 8px; overflow: hidden;
    background: rgba(6,11,20,.6);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-row:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(0,229,201,.15);
  }
  .input-icon {
    display: flex; align-items: center; justify-content: center;
    width: 40px; flex-shrink: 0;
    color: var(--text-3); font-size: .9rem;
    border-right: 1px solid var(--border);
  }
  input[type=text],
  input[type=password] {
    flex: 1;
    background: transparent;
    border: none; outline: none;
    color: var(--text); font-family: var(--font);
    font-size: .875rem;
    padding: .65rem .8rem;
  }
  input::placeholder { color: var(--text-3); }

  .btn-login {
    display: flex; align-items: center; justify-content: center; gap: .4rem;
    width: 100%;
    padding: .7rem 1rem;
    border-radius: 8px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #00c4ab, var(--brand));
    color: #041410; font-family: var(--font);
    font-size: .875rem; font-weight: 700;
    letter-spacing: .01em;
    transition: all .2s;
    box-shadow: 0 2px 16px rgba(0,229,201,.3);
    margin-top: .25rem;
  }
  .btn-login:hover {
    background: linear-gradient(135deg, var(--brand), #00ffdb);
    box-shadow: 0 4px 24px rgba(0,229,201,.45);
    transform: translateY(-1px);
  }
  .btn-login:active { transform: translateY(0); }

  .error-msg {
    display: flex; align-items: center; gap: .5rem;
    padding: .65rem .85rem;
    background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.3);
    border-radius: 8px; color: #fca5a5;
    font-size: .8rem; margin-bottom: 1.25rem;
  }
  .error-msg svg { flex-shrink: 0; }

  .login-footer {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: .75rem; color: var(--text-3);
    line-height: 1.6;
  }

  /* eye toggle */
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: .65rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--text-3); padding: 0; font-size: .85rem;
    transition: color .15s;
  }
  .pw-toggle:hover { color: var(--text-2); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">

      <div class="logo-mark">DH</div>
      <h1 class="login-title">DataHub</h1>
      <p class="login-sub">{{ SITE_TAGLINE }}</p>

      {% if error %}
      <div class="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="field">
          <label for="username">Username</label>
          <div class="input-row">
            <div class="input-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <input id="username" name="username" type="text"
                   placeholder="your username"
                   autofocus autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-row pw-wrap">
            <div class="input-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input id="password" name="password" type="password"
                   placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="pw-toggle" onclick="togglePw()" tabindex="-1" aria-label="Toggle password">
              <svg id="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign in
        </button>
      </form>

      <div class="login-footer">
        Access restricted to authorised users.<br>
        Contact your administrator to request access.
      </div>

    </div>
  </div>

  <script>
  function togglePw() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
  </script>
</body>
</html>
