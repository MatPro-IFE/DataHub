name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here; see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: DataHub version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, uploaded folder layout and the relevant part of the project schema (rename anything confidential).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs dashboard ml-api` around the error.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Docker 27, Compose v2.29"
